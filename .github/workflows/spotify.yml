name: Update Spotify now playing

on:
  schedule:
    # Run every 5 minutes, offset from the top of the hour to reduce
    # contention during GitHub Actions' busiest scheduled-workflow window.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spotify-now-playing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate Spotify card
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: python3 scripts/update_spotify.py
      - name: Commit updated Spotify card
        run: |
          if git diff --quiet -- assets/spotify.svg; then
            echo "Spotify card has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/spotify.svg
          git commit -m "chore: update Spotify now playing"
          git push
