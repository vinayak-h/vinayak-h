name: Update profile metrics

on:
  schedule:
    - cron: "31 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_metrics.py"
      - ".github/workflows/profile-metrics.yml"

permissions:
  contents: write

concurrency:
  group: profile-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Generate metrics from GitHub public API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_metrics.py
      - name: Commit updated metrics
        run: |
          if git diff --quiet -- assets/github-metrics.svg; then
            echo "Metrics have not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-metrics.svg
          git commit -m "chore: update profile metrics"
          git push
